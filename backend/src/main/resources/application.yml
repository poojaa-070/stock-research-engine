spring:
  application:
    name: stock-research-engine
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stock_research}
    username: ${DB_USER:stock_research}
    password: ${DB_PASSWORD:changeme}
  jpa:
    hibernate:
      ddl-auto: validate   # schema.sql is the source of truth, not Hibernate auto-DDL
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  threads:
    virtual:
      enabled: true        # request threads mostly wait on the scraper / Claude

server:
  port: ${PORT:8080}

claude:
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${CLAUDE_MODEL:claude-sonnet-4-6}
  base-url: https://api.anthropic.com/v1/messages
  timeout-seconds: 45

scraper:
  base-url: ${SCRAPER_BASE_URL:http://localhost:8000}
  scrape-timeout-seconds: 120   # import / refresh run a full synchronous scrape
  quick-timeout-seconds: 15     # live quote, live peers

scoring:
  # Banks/NBFCs/insurers: skip debt-to-equity and debt/EBITDA (borrowing is a
  # lender's raw material). Set false to restore v1 behaviour.
  skip-leverage-for-financials: true
  category-weights:
    financial_health: 0.20
    business_quality: 0.20
    growth: 0.15
    valuation: 0.20
    management: 0.10
    risk: 0.10
    momentum: 0.05

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
  reports:
    cache-minutes: 15          # GET /reports/latest reuses a report this young
    reuse-seconds: 60          # POST /reports/generate reuses one this young unless ?force=true
    cache-max-entries: 200
  watchlist:
    # Spring cron (sec min hour day month weekday). "-" disables.
    # e.g. "0 30 18 * * MON-FRI" re-scores the watchlist after NSE's close.
    refresh-cron: ${WATCHLIST_REFRESH_CRON:-}
    refresh-zone: Asia/Kolkata

logging:
  level:
    com.stockresearch: ${LOG_LEVEL:INFO}
