# Whole stack in one command:   docker compose up --build
# Then open http://localhost:5173
#
# The database is initialised on FIRST start only (empty volume), in this
# order. To start from scratch again:  docker compose down -v
# Drop the two demo seed lines below if you don't want demo companies.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: stock_research
      POSTGRES_USER: ${DB_USER:-stock_research}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed_scoring_rules.sql:/docker-entrypoint-initdb.d/02_seed_scoring_rules.sql:ro
      - ./database/seed_demo_companies.sql:/docker-entrypoint-initdb.d/03_seed_demo_companies.sql:ro
      - ./database/seed_demo_prices.sql:/docker-entrypoint-initdb.d/04_seed_demo_prices.sql:ro
      - ./database/seed_demo_history.sql:/docker-entrypoint-initdb.d/05_seed_demo_history.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-stock_research} -d stock_research"]
      interval: 5s
      timeout: 5s
      retries: 20

  scraper:
    build: ./scraper
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER:-stock_research}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/stock_research
      DB_USER: ${DB_USER:-stock_research}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      SCRAPER_BASE_URL: http://scraper:8000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      WATCHLIST_REFRESH_CRON: ${WATCHLIST_REFRESH_CRON:--}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080/api
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
